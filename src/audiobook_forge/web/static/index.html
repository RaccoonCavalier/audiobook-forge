<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audiobook Forge · 有声书工坊</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">🎧</span>
    <div>
      <h1>Audiobook Forge</h1>
      <p class="tagline">EPUB / TXT / Markdown → 有声书</p>
    </div>
  </div>
  <div class="topbar-right">
    <div class="status" id="status">连接中…</div>
    <button class="ghost small" id="settingsBtn" title="设置">⚙ 设置</button>
  </div>
</header>

<div class="modal" id="settingsModal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2>设置</h2>
      <button class="ghost small" id="settingsClose">✕</button>
    </div>

    <section class="modal-section">
      <h3>文本分拣（LLM）</h3>
      <p class="muted small">负责断句、判断谁在说话、给角色挑音色、写朗读指令。不启用时用规则兜底。</p>
      <label class="row"><input type="checkbox" id="llmEnabled"> 启用 LLM 分拣</label>
      <label class="field">预设
        <select id="llmPreset"></select>
      </label>
      <label class="field">API 地址
        <input id="llmBase" placeholder="https://api.siliconflow.cn/v1">
      </label>
      <label class="field">模型
        <input id="llmModel" placeholder="deepseek-ai/DeepSeek-V3.2">
      </label>
      <label class="field">API Key
        <input id="llmKey" type="password" placeholder="留空 = 不修改已保存的密钥">
      </label>
      <p class="muted small" id="llmState"></p>
    </section>

    <section class="modal-section">
      <h3>TTS 提供商</h3>
      <label class="field">用于合成音频
        <select id="ttsProvider"></select>
      </label>
      <p class="muted small" id="ttsState"></p>
    </section>

    <div class="modal-actions">
      <button class="ghost" id="settingsCancel">取消</button>
      <button class="primary" id="settingsSave">保存</button>
    </div>
    <p class="muted small">设置保存在本机 <code>data/settings.json</code>，不会写进代码仓库。</p>
  </div>
</div>

<main class="layout">
  <aside class="sidebar">
    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept=".epub,.txt,.md,.markdown" hidden>
      <div class="dz-icon">＋</div>
      <p><strong>点击或拖入文件</strong></p>
      <p class="muted">epub / txt / md，最大 200MB</p>
    </div>
    <div class="shelf-head">
      <h2>书架</h2>
      <button class="ghost small" id="refreshBtn" title="刷新">↻</button>
    </div>
    <ul class="shelf" id="shelf"></ul>
  </aside>

  <section class="detail" id="detail">
    <div class="empty">
      <div class="empty-icon">📚</div>
      <h2>还没有选中书</h2>
      <p class="muted">上传一本书，或从左侧书架里挑一本</p>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
