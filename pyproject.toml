[project]
name = "audiobook-forge"
version = "0.1.0"
description = "把 EPUB / TXT / Markdown 变成有声书：LLM 负责分拣与导演，TTS 负责发声。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ben", email = "2284287563@qq.com" }]
keywords = ["audiobook", "tts", "epub", "llm", "xiaomi-mimo", "xfyun"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
abf = "audiobook_forge.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audiobook_forge = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
